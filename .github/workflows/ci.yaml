name: LANDING CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout the codebase
              uses: actions/checkout@v4

            - name: Read version
              id: version
              run: echo "tag=$(cat version.txt)" >> $GITHUB_OUTPUT

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  registry: docker.io
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_PASSWORD }}

            - name: Build and push docker image
              run: |
                  docker build \
                    -t ${{ secrets.DOCKERHUB_USERNAME }}/mdj-landing:${{ steps.version.outputs.tag }} \
                    -t ${{ secrets.DOCKERHUB_USERNAME }}/mdj-landing:latest \
                    .
                  docker push ${{ secrets.DOCKERHUB_USERNAME }}/mdj-landing:${{ steps.version.outputs.tag }}
                  docker push ${{ secrets.DOCKERHUB_USERNAME }}/mdj-landing:latest
