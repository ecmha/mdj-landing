name: LANDING CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    release:
        types: [published]

permissions:
    contents: read

env:
    IMAGE_NAME: mdj-landing

jobs:
    docker:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout the codebase
              uses: actions/checkout@v4

            # On a release the tag is the single source of truth for the image
            # tag. Everywhere else we only prove the image still builds, so a
            # throwaway local tag is enough and nothing is pushed.
            - name: Resolve image tags
              id: meta
              run: |
                  if [ "${{ github.event_name }}" != "release" ]; then
                      echo "tags=${IMAGE_NAME}:ci" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi

                  tag="${{ github.event.release.tag_name }}"
                  if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
                      echo "::error::Release tag '$tag' does not match the expected vX.X.X pattern"
                      exit 1
                  fi

                  version="${tag#v}"
                  repo="${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}"
                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  echo "tags=${repo}:${version},${repo}:latest" >> "$GITHUB_OUTPUT"

            - name: Check the version file matches the release
              if: github.event_name == 'release'
              env:
                  VERSION: ${{ steps.meta.outputs.version }}
              run: |
                  current=$(cat version.txt)
                  if [ "$current" != "$VERSION" ]; then
                      echo "::warning::version.txt is at $current but the release is $VERSION — was the prepare-release PR merged before tagging?"
                  fi

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Docker Hub
              if: github.event_name == 'release'
              uses: docker/login-action@v3
              with:
                  registry: docker.io
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_PASSWORD }}

            - name: Build and push docker image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: ${{ github.event_name == 'release' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
