name: LANDING Release

on:
    release:
        types: [published]
    pull_request:
        branches:
            - main

permissions:
    contents: read

jobs:
    # PRs to main only prove the image builds; nothing is published.
    validate:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout the codebase
              uses: actions/checkout@v4

            - name: Build docker image
              run: docker build -t mdj-landing:pr-${{ github.event.pull_request.number }} .

    publish:
        if: github.event_name == 'release'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout the released tag
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.release.tag_name }}

            - name: Resolve version from the release tag
              id: version
              env:
                  TAG_NAME: ${{ github.event.release.tag_name }}
              run: |
                  if ! printf '%s' "$TAG_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
                      echo "::error::Release tag '$TAG_NAME' does not match the expected vX.Y.Z pattern"
                      exit 1
                  fi
                  echo "version=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"

            # The tag is the source of truth, so make the image agree with it
            # rather than with whatever version.txt happened to hold at tag time.
            - name: Stamp version.txt with the released version
              run: printf '%s\n' "${{ steps.version.outputs.version }}" > version.txt

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  registry: docker.io
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_PASSWORD }}

            - name: Build and push docker image
              env:
                  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/mdj-landing
                  VERSION: ${{ steps.version.outputs.version }}
                  PRERELEASE: ${{ github.event.release.prerelease }}
              run: |
                  docker build -t "$IMAGE:$VERSION" .
                  docker push "$IMAGE:$VERSION"

                  # a prerelease gets its own version tag but must not move `latest`
                  if [ "$PRERELEASE" = "false" ]; then
                      docker tag "$IMAGE:$VERSION" "$IMAGE:latest"
                      docker push "$IMAGE:latest"
                  else
                      echo "::notice::$VERSION is a prerelease — leaving :latest untouched"
                  fi
